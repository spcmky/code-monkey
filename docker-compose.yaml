networks:
  db:
    driver: bridge
  services:
    driver: bridge
  tools:
    driver: bridge

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: code-monkey-db
    environment:
      POSTGRES_DB: code_monkey
      POSTGRES_USER: code_monkey
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_monkey -d code_monkey"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db
      - tools

  # Controller — long-running service that polls GitHub
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: code-monkey-controller
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: code_monkey
      DB_USER: code_monkey
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      LOG_LEVEL: debug
    volumes:
      - ./config:/app/config:ro
      - workspaces:/tmp/code-monkey-workspaces
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # TODO: Replace pgrep healthcheck with a proper HTTP /healthz endpoint
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/index.js' || exit 1"]
      interval: 31s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db
      - services

  # Agent worker — picks up tasks from SQS (or local queue in dev)
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: code-monkey-agent
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: code_monkey
      DB_USER: code_monkey
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
      LOG_LEVEL: debug
    volumes:
      - ./config:/app/config:ro
      - workspaces:/tmp/code-monkey-workspaces
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # TODO: Replace pgrep healthcheck with a proper HTTP /healthz endpoint
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/agent-worker.js' || exit 1"]
      interval: 29s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - db
      - services

  # LocalStack — mock AWS services for local dev (SQS, SNS, Secrets Manager)
  localstack:
    image: localstack/localstack:3.5
    container_name: code-monkey-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,sns,secretsmanager
      DEFAULT_REGION: us-east-2
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - services

  # pgAdmin — optional DB GUI
  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: code-monkey-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/pgadmin/sessions
      - /var/lib/pgadmin/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5050/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tools

volumes:
  pgdata:
  workspaces:
  localstack-data:
